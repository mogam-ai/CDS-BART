# @package _global_
general:
  seed: 17
  project_name: cds_bart_project
  run_name: test_sars_degradation_lr1_batch4
  checkpoint_path: /fsx/s3/project/P240002_mRNA_LLM/checkpoints/finetune/CDS_BART_finetuning
  num_gpus: 1
  n_cpus: 10
  n_epochs: 40
  repo_id: "mogam-ai"
  model_name: "CDS-BART-denoising"
  dataset_name: "CDS-BART-SARS-CoV-2-vaccine-degradation"
  task_type: "regression"
  task_name: "sars_degradation"
  num_labels: 1
  wandb: true

wandb_config:
  entity: sangheon-lee-mibr
  project: ${general.project_name}
  name: ${general.run_name}
  tags:
  - cds-bart
  - finetune
  - ${general.task_type}
  - ${general.task_name}
data:
  dataset_name_or_path: ${general.repo_id}/${general.dataset_name}
  model_name_or_path: ${general.repo_id}/${general.model_name}
  tokenizer_name_or_path: ${general.repo_id}/${general.model_name}
  label_name: 'y'
  max_len: 850
  vocab_size: 4096
  batch_size: 4
  num_workers: 30
  pin_memory: true
hg:
  training:
    output_dir: ${general.checkpoint_path}/${general.run_name}
    overwrite_output_dir: true
    num_train_epochs: ${general.n_epochs}
    do_train: true
    do_eval: true
    eval_strategy: epoch
    save_strategy: epoch
    per_device_train_batch_size: ${data.batch_size}
    per_device_eval_batch_size: ${data.batch_size}
    logging_steps: 1
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 0.00000001 
    weight_decay: 0.01
    gradient_accumulation_steps: 1
    dataloader_num_workers: 10
    metric_for_best_model: eval_loss
    report_to: wandb
    greater_is_better: false
    load_best_model_at_end: true
    lr_scheduler_type: linear
    max_grad_norm: 1.0
    warmup_ratio: 0.1
    learning_rate: 1.0e-05
