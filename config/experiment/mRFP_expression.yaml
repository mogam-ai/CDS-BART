# @package _global_
general:
  seed: 17
  project_name: cds_bart_project
  run_name: finetune_mRFP_expression
  checkpoint_path: /fsx/s3/project/P240002_mRNA_LLM/checkpoints/finetune/submission  
  num_gpus: 1
  n_cpus: 10
  n_epochs: 40
  repo_id: "mogam-ai"
  model_name: "CDS-BART-denoising"
  dataset_name: "CDS-BART-mRFP-expression"
  task_type: "regression"
  task_name: "mRFP_expression"
  num_labels: 1
  wandb: false

wandb_config:
  entity: "mogam-research"
  project: ${general.project_name}
  name: ${general.run_name}
  tags:
  - cds-bart
  - finetune
  - ${general.task_type}
  - ${general.task_name}
data:
  dataset_name_or_path: ${general.repo_id}/${general.dataset_name}
  model_name_or_path: ${general.repo_id}/${general.model_name}
  tokenizer_name_or_path: ${general.repo_id}/${general.model_name}
  label_name: 'y'
  scaling_method: 'std' # 'std' for standard and  'min_max' min_max scaling , 'no' for no scaling
  max_len: 850
  vocab_size: 4096
  batch_size: 64
  num_workers: 30
  pin_memory: true
hg:
  training:
    output_dir: ${general.checkpoint_path}/${general.run_name}
    overwrite_output_dir: true
    num_train_epochs: ${general.n_epochs}
    do_train: true
    do_eval: true
    eval_strategy: epoch
    save_strategy: epoch
    per_device_train_batch_size: ${data.batch_size}
    per_device_eval_batch_size: ${data.batch_size}
    logging_steps: 50
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-08
    weight_decay: 0.01
    gradient_accumulation_steps: 1
    dataloader_num_workers: 10
    metric_for_best_model: eval_loss
    report_to: wandb
    greater_is_better: false
    load_best_model_at_end: true
    lr_scheduler_type: linear
    max_grad_norm: 1.0
    warmup_ratio: 0.1
    learning_rate: 2.0e-05
